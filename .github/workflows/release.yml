name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; only the release job (below) can write to the repository.
# Third-party actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps
# them current.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - name: macOS ARM64 (Apple Silicon)
            target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: vej-macos-arm64
            archive_format: tar.gz
            binary_name: vej
            zvej_goos: darwin
            zvej_goarch: arm64

          # macOS Intel (x86_64)
          - name: macOS x86_64 (Intel)
            target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: vej-macos-x86_64
            archive_format: tar.gz
            binary_name: vej
            zvej_goos: darwin
            zvej_goarch: amd64

          # Linux AMD64 (x86_64)
          - name: Linux x86_64 (AMD64)
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: vej-linux-x86_64
            archive_format: tar.gz
            binary_name: vej
            zvej_goos: linux
            zvej_goarch: amd64

          # Linux ARM64 (aarch64)
          - name: Linux ARM64 (aarch64)
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: vej-linux-arm64
            archive_format: tar.gz
            binary_name: vej
            zvej_goos: linux
            zvej_goarch: arm64

          # Windows AMD64 (x86_64)
          - name: Windows x86_64 (AMD64)
            target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: vej-windows-x86_64
            archive_format: zip
            binary_name: vej.exe

          # Windows ARM64 (aarch64)
          - name: Windows ARM64 (aarch64)
            target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: vej-windows-arm64
            archive_format: zip
            binary_name: vej.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Setup MSVC environment for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64_arm64

      - name: Setup Clang for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: egor-tensin/setup-clang@c806e5e95b4f097c34622c07201b4aac45d8c897 # v2.3.3
        with:
          version: latest
          platform: x64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Required when the action is pinned by SHA rather than by its `stable` branch.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build binary (release)
        if: matrix.target != 'aarch64-pc-windows-msvc'
        env:
          GGML_NATIVE: "OFF"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (Windows ARM64 with clang-cl & Ninja)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        env:
          GGML_NATIVE: "OFF"
          GGML_OPENMP: "OFF"
          CMAKE_GENERATOR: "Ninja"
          CC: "clang-cl"
          CXX: "clang-cl"
          CFLAGS: "-Wno-error --target=aarch64-pc-windows-msvc"
          CXXFLAGS: "/EHsc -Wno-error --target=aarch64-pc-windows-msvc"
          CMAKE_SYSTEM_NAME: "Windows"
          CMAKE_SYSTEM_PROCESSOR: "ARM64"
        run: cargo build --release --target ${{ matrix.target }}

      # zvej (OpenZiti host for vej) is pure Go; it ships next to vej on macOS and Linux.
      - name: Setup Go (zvej)
        if: matrix.zvej_goos != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: zvej/go.mod
          cache-dependency-path: zvej/go.sum

      - name: Build zvej
        if: matrix.zvej_goos != ''
        working-directory: zvej
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.zvej_goos }}
          GOARCH: ${{ matrix.zvej_goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o ../target/${{ matrix.target }}/release/zvej .

      - name: Package archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          if [ -f target/${{ matrix.target }}/release/zvej ]; then
            cp target/${{ matrix.target }}/release/zvej staging/
          fi
          cp README.md staging/
          if [ -d "playground" ]; then
            cp -r playground staging/
            rm -rf staging/playground/node_modules staging/playground/dist
          fi
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C staging .

      - name: Package archive (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination staging/
          Copy-Item "README.md" -Destination staging/
          if (Test-Path "playground") {
            Copy-Item -Recurse "playground" -Destination staging/
            if (Test-Path "staging/playground/node_modules") {
              Remove-Item -Recurse -Force "staging/playground/node_modules"
            }
            if (Test-Path "staging/playground/dist") {
              Remove-Item -Recurse -Force "staging/playground/dist"
            }
          }
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vej-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate SHA256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum vej-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
