spring.application.name=vej-customer-service-demo
server.port=8081

# Local vej daemon (runs on 8080 by default so there is no port conflict with Vaadin on 8081)
vej.base-url=${VEJ_BASE_URL:http://127.0.0.1:8080}
vej.auto-start=${VEJ_AUTO_START:true}
vej.binary-path=${VEJ_BIN:}
vej.default-model=${VEJ_MODEL:}
vej.jev-model=${JEV_MODEL:jev-latest}
vej.jev-api-key=${TYPESAFE_API_KEY:${TYPESAFE_API_TOKEN:${TYPESAFE_TOKEN:${TYPESAFE_KEY:${JEV_API_KEY:}}}}}
vej.request-timeout-seconds=45

# Keep Vaadin startup quiet and fast for demo runs
vaadin.launch-browser=false
